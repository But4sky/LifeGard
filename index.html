<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeGarden · 人生格子</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #E5E5E5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 4px;
      margin-bottom: 8px;
      color: #111;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }

    .input-section {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 0.85rem;
      color: #666;
      letter-spacing: 1px;
    }

    .input-group input {
      background: #fff;
      border: 2px solid #ccc;
      color: #333;
      padding: 12px 16px;
      font-size: 1rem;
      border-radius: 8px;
      outline: none;
      transition: all 0.2s;
      cursor: pointer;
    }

    .input-group input:hover {
      border-color: #999;
      background: #fff;
    }

    .input-group input:focus {
      border-color: #4a9eff;
      box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.2);
    }

    .btn-calculate {
      background: #333;
      color: #fff;
      border: none;
      padding: 12px 32px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .btn-calculate:hover {
      opacity: 0.85;
    }

    .stats {
      display: flex;
      gap: 40px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: 300;
      color: #333;
    }

    .stat-value.used {
      color: #e53935;
    }

    .stat-value.remain {
      color: #43a047;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #888;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .grid-container {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #ddd;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(40, 1fr);
      gap: 2px;
      width: min(800px, 90vw);
    }

    .cell {
      aspect-ratio: 1;
      background: #e0e0e0;
      border-radius: 2px;
      transition: background 0.3s;
    }

    .cell.filled {
      background: #e53935;
    }

    .cell.remaining {
      background: #e0e0e0;
    }

    .legend {
      display: flex;
      gap: 24px;
      margin-top: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: #666;
      font-weight: 500;
    }

    .legend-dot {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .legend-dot.filled {
      background: #e53935;
    }

    .legend-dot.remaining {
      background: #e0e0e0;
      border: 2px solid #bbb;
    }

    .message {
      margin-top: 20px;
      color: #888;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: repeat(20, 1fr);
      }

      h1 {
        font-size: 1.5rem;
      }

      .stats {
        gap: 24px;
      }

      .stat-value {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <h1>LIFEGARD</h1>
  <p class="subtitle">人生格子 · 1200个月</p>

  <div class="input-section">
    <div class="input-group">
      <label>出生日期</label>
      <input type="date" id="birthdate" min="1900-01-01" max="9999-12-31">
    </div>
    <div class="input-group">
      <label>计算日期（今天）</label>
      <input type="date" id="targetdate">
    </div>
    <button class="btn-calculate" onclick="calculate()">计算</button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value used" id="monthsUsed">0</div>
      <div class="stat-label">已用月份</div>
    </div>
    <div class="stat">
      <div class="stat-value remain" id="monthsLeft">1200</div>
      <div class="stat-label">剩余月份</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="percentage">0%</div>
      <div class="stat-label">已度过</div>
    </div>
  </div>

  <div class="grid-container">
    <div class="grid" id="grid"></div>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot filled"></div>
        <span>已度过</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot remaining"></div>
        <span>剩余</span>
      </div>
    </div>
  </div>

  <p class="message" id="message"></p>

  <script>
    const TOTAL_CELLS = 1200;
    const COLS = 40;
    const ROWS = 30;

    // 设置默认日期为今天
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('targetdate').value = today;

    // 限制出生日期年份为4位数字
    const birthdateInput = document.getElementById('birthdate');
    birthdateInput.addEventListener('input', function(e) {
      const value = this.value;
      // 如果输入的长度超过10位（YYYY-MM-DD），截断
      if (value.length > 10) {
        this.value = value.slice(0, 10);
      }
      // 验证年份部分是否为4位
      const yearMatch = value.match(/^\d{4}/);
      if (yearMatch && yearMatch[0].length > 4) {
        this.value = value.slice(0, 4);
      }
    });

    birthdateInput.addEventListener('blur', function() {
      const value = this.value;
      // 如果年份不足4位，清空或提示
      if (value && value.length < 4) {
        this.value = '';
      }
    });

    function calculate() {
      const birthStr = document.getElementById('birthdate').value;
      const targetStr = document.getElementById('targetdate').value;

      if (!birthStr || !targetStr) {
        document.getElementById('message').textContent = '请选择出生日期和计算日期';
        return;
      }

      const birth = new Date(birthStr);
      const target = new Date(targetStr);

      if (target <= birth) {
        document.getElementById('message').textContent = '计算日期必须晚于出生日期';
        return;
      }

      // 计算月份差
      const monthsUsed = (target.getFullYear() - birth.getFullYear()) * 12 
                        + (target.getMonth() - birth.getMonth());
      
      // 确保至少是0
      const safeMonthsUsed = Math.max(0, Math.min(monthsUsed, TOTAL_CELLS));
      const monthsLeft = TOTAL_CELLS - safeMonthsUsed;
      const percentage = ((safeMonthsUsed / TOTAL_CELLS) * 100).toFixed(1);

      // 更新统计
      document.getElementById('monthsUsed').textContent = safeMonthsUsed;
      document.getElementById('monthsLeft').textContent = monthsLeft;
      document.getElementById('percentage').textContent = percentage + '%';

      // 渲染格子
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      for (let i = 0; i < TOTAL_CELLS; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell ' + (i < safeMonthsUsed ? 'filled' : 'remaining');
        grid.appendChild(cell);
      }

      // 生命寄语
      const message = document.getElementById('message');
      if (safeMonthsUsed >= 800) {
        message.textContent = '余生不长，但每一天都是馈赠。';
      } else if (safeMonthsUsed >= 500) {
        message.textContent = '半生已过，愿你珍惜接下来的每一天。';
      } else if (safeMonthsUsed >= 200) {
        message.textContent = '人生最宝贵的时光，好好把握。';
      } else {
        message.textContent = '路还很长，但要开始认真了。';
      }
    }

    // 页面加载时自动计算一次（如果有默认生日）
    window.onload = function() {
      // 如果用户之前填过，可以从 localStorage 恢复
      const savedBirth = localStorage.getItem('lifegard_birth');
      if (savedBirth) {
        document.getElementById('birthdate').value = savedBirth;
        calculate();
      }
    };

    // 保存生日到 localStorage
    document.getElementById('birthdate').addEventListener('change', function() {
      localStorage.setItem('lifegard_birth', this.value);
    });
  </script>
</body>
</html>
